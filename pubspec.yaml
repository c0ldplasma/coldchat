name: coldchat
description: ColdChat, a third-party Twitch chat client for Android and iOS
publish_to: 'none'
version: 2.1.0+124

environment:
  # 3.13.7 / Flutter 3.47.8 fix GHSA-frr6-h895-5pxp (compromised eMudhra CAs
  # trusted by dart:io on Android).
  sdk: '>=3.13.7 <4.0.0'
  flutter: '>=3.47.8'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  webview_flutter: ^4.9.0
  # webview_cookie_manager: ^2.0.6
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  bloc: ^8.1.0
  flutter_bloc: ^8.1.1
  equatable: ^2.0.5
  provider: ^6.1.2
  collection: ^1.18.0
  sliver_tools: ^0.2.12
  file_picker: ^13.2.0
  json_annotation: ^4.9.0
  url_launcher: ^6.3.0
  wakelock_plus: ^1.8.2
  flutter_svg: ^2.0.10+1
  carousel_slider: ^5.0.0
  flutter_localized_locales: ^2.0.5
  cached_network_image: ^3.3.1
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.16.0
  path_provider: ^2.1.4
  image_picker: ^1.2.4
  package_info_plus: ^10.2.2
  # Pinned by the Flutter SDK; used for the legacy surfaceVariant color.
  material_color_utilities: any

dev_dependencies:
  # flutter_test:
  #   sdk: flutter
  flutter_lints: ^2.0.1
  json_serializable: ^6.5.1
  hive_generator: ^2.0.0
  build_runner: ^2.4.5 # flutter packages pub run build_runner build
  analyzer: ^5.13.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/emote_providers/
    - fonts/OFL.txt
  fonts:
    # Variable font; M3Parser.fontVariations sets its width and optical size.
    - family: GoogleSansFlex
      fonts:
        - asset: fonts/GoogleSansFlex.ttf
