# Analyzer settings for `flutter analyze` and the IDE. Keep it at "No issues found!" (CI fails otherwise).
# Silence a finding only where it is wrong, with `// ignore: <rule>` on that line and a comment saying why.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    # Generated by build_runner.
    - "**/*.g.dart"
  language:
    # No silent `dynamic`: values from JSON and other dynamic sources need an explicit `as`, and every type
    # argument the analyzer can't infer has to be written out.
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

# On top of flutter_lints (https://dart.dev/tools/linter-rules).
linter:
  rules:
    # Futures: await them, or wrap them in unawaited() to say they run on their own.
    - unawaited_futures
    - discarded_futures
    - cancel_subscriptions
    - close_sinks
    # Errors
    - only_throw_errors
    - throw_in_finally
    - avoid_dynamic_calls
    - test_types_in_equals
    - unnecessary_statements
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - avoid_type_to_string
    - avoid_slow_async_io
    # Style
    - always_declare_return_types
    - directives_ordering
    - prefer_relative_imports
    - prefer_single_quotes
    - prefer_final_locals
    - prefer_const_constructors
    - prefer_const_declarations
    - require_trailing_commas
    - unnecessary_lambdas
    - unnecessary_parenthesis

formatter:
  page_width: 120
  # Keep trailing commas where they are: they were set deliberately to split argument lists one per line.
  trailing_commas: preserve
