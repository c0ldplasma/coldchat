version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: pub
    directory: /
    schedule:
      interval: monthly
    groups:
      # Minor and patch updates in one PR; each major update gets its own, since those can need code changes.
      minor-and-patch:
        update-types: [minor, patch]
