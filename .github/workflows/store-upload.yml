name: Store 1 · Build and upload

# Step 1 of a release: builds the release tag (see "Versioning" in CLAUDE.md) and uploads it to TestFlight and Play's
# internal testing track. Steps 2 and 3 are the other store-*.yml workflows, started by hand.
#
# Secrets live in the "release" environment (Settings → Environments), which asks for an approval before a run gets
# them:
#   APP_STORE_CONNECT_API_KEY, APP_STORE_CONNECT_API_KEY_ID, APP_STORE_CONNECT_ISSUER_ID  (App Store Connect API key)
#   ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_KEYSTORE_PASSWORD                       (Play upload key)
#   PLAY_SERVICE_ACCOUNT_JSON                                                              (Play API access)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v2.6.0+157
        required: true

defaults:
  run:
    shell: bash

env:
  FLUTTER_VERSION: '3.47.8'
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  ios:
    name: iOS → TestFlight
    runs-on: macos-latest
    environment: release
    env:
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Generate sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Install the App Store Connect API key for Xcode
        run: |
          key="$RUNNER_TEMP/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY" > "$key"
          echo "API_KEY_PATH=$key" >> "$GITHUB_ENV"

      # `flutter build ipa` can't pass the API key to Xcode, so Flutter only prepares the project and xcodebuild
      # archives and exports it. With the key, Xcode signs in the cloud: no certificate or profile on the runner.
      - name: Prepare the Xcode project
        run: flutter build ios --release --config-only

      - name: Archive and export
        run: |
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$API_KEY_PATH"
                -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID")
          xcodebuild archive -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/ios/archive/Runner.xcarchive "${auth[@]}"
          xcodebuild -exportArchive -archivePath build/ios/archive/Runner.xcarchive -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist "${auth[@]}"

      - name: Upload to TestFlight
        run: bundle exec fastlane ios testflight_upload ipa:"$(ls build/ios/ipa/*.ipa)"

      - uses: actions/upload-artifact@v7
        with:
          name: coldchat-ios-${{ env.TAG }}
          path: build/ios/ipa/*.ipa

  android:
    name: Android → Play internal testing
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Generate sources
        run: dart run build_runner build --delete-conflicting-outputs

      # The same android/key.properties as for a local release build (see CLAUDE.md), pointing at the upload key.
      - name: Set up the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<PROPERTIES
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=upload
          PROPERTIES

      - name: Build the app bundle
        run: flutter build appbundle --release

      # Play only accepts drafts until the app has been published once. After that, set the repository variable
      # PLAY_INTERNAL_STATUS to "completed" so internal testers get the build right away.
      - name: Upload to internal testing
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          bundle exec fastlane android internal_upload \
            aab:build/app/outputs/bundle/release/app-release.aab build:"${TAG##*+}" status:"${{ vars.PLAY_INTERNAL_STATUS || 'draft' }}"

      - uses: actions/upload-artifact@v7
        with:
          name: coldchat-android-${{ env.TAG }}
          path: build/app/outputs/bundle/release/app-release.aab
