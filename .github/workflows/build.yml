name: Build

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # The minimum in pubspec.yaml. Pinned so a new Flutter release can't break CI on its own.
  FLUTTER_VERSION: '3.47.8'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check that the checked-in localizations are up to date
        # gen-l10n writes build/untranslated_messages.json and fails if build/ doesn't exist yet.
        run: |
          mkdir -p build
          flutter gen-l10n
          git diff --exit-code lib/l10n

      - name: Analyze
        run: flutter analyze

      # Generated files are left out: gen-l10n and build_runner format their own output.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed $(git ls-files 'lib/*.dart' 'test/*.dart' | grep -v '^lib/l10n/app_localizations')

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Android
            os: ubuntu-latest
          - target: iOS
            os: macos-latest

    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        if: matrix.target == 'Android'
        with:
          distribution: temurin
          java-version: '17'
          # Gradle resolves Kotlin through plugins.gradle.org, whose Maven Central mirror sometimes answers 404 for a
          # while. With the cache, runs after the first don't need it.
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build for Android
        if: matrix.target == 'Android'
        # One retry for the mirror outages described at setup-java.
        run: flutter build apk || { sleep 60; flutter build apk; }

      - name: Build for iOS
        if: matrix.target == 'iOS'
        run: flutter build ios --no-codesign

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        if: matrix.target == 'Android'
        with:
          name: coldchat-android.apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Pack iOS ipa
        if: matrix.target == 'iOS'
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -rf build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/Runner.app
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Payload build/ios/iphoneos/iOS.ipa

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v7
        if: matrix.target == 'iOS'
        with:
          name: coldchat-ios.ipa
          path: build/ios/iphoneos/iOS.ipa
