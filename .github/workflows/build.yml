name: Build

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a PR makes its older run pointless. Runs on main always finish: they write the caches PRs read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # The minimum in pubspec.yaml. Pinned so a new Flutter release can't break CI on its own.
  FLUTTER_VERSION: '3.47.8'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # build_runner's state; with it, only sources that changed are generated again.
      - uses: actions/cache@v6
        with:
          path: .dart_tool/build
          key: build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-${{ hashFiles('lib/**/*.dart') }}
          restore-keys: build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-

      - name: Generate sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check that the localizations are complete and up to date
        # gen-l10n writes build/untranslated_messages.json and fails if build/ doesn't exist yet. That file lists every
        # key a language lacks.
        run: |
          mkdir -p build
          flutter gen-l10n
          git diff --exit-code lib/l10n
          if [ "$(tr -d '[:space:]' < build/untranslated_messages.json)" != "{}" ]; then
            echo "::error::Strings missing from some languages (add them to every lib/l10n/*.arb):"
            cat build/untranslated_messages.json
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Generated files are left out: gen-l10n and build_runner format their own output.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed $(git ls-files 'lib/*.dart' 'test/*.dart' | grep -v '^lib/l10n/app_localizations')

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Android
            os: ubuntu-latest
          - target: iOS
            os: macos-latest

    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        if: matrix.target == 'Android'
        with:
          distribution: temurin
          java-version: '17'

      # Caches Gradle's downloads and, with org.gradle.caching in gradle.properties, the plugins' compiled classes.
      # That also keeps runs off plugins.gradle.org, whose Maven Central mirror sometimes answers 404 for a while.
      # Only runs on main write the cache; PRs read it.
      - uses: gradle/actions/setup-gradle@v6
        if: matrix.target == 'Android'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # build_runner's state; with it, only sources that changed are generated again.
      - uses: actions/cache@v6
        with:
          path: .dart_tool/build
          key: build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-${{ hashFiles('lib/**/*.dart') }}
          restore-keys: build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-

      - name: Generate sources
        run: dart run build_runner build --delete-conflicting-outputs

      # The runner image doesn't have the NDK version Flutter pins, and downloading it (~1.5 GB) took longer than
      # the build itself. CMake is for the jni plugin's native code.
      - name: Find the NDK version Flutter uses
        id: ndk
        if: matrix.target == 'Android'
        # Fails if Flutter moves it, rather than caching the whole ndk/ folder under an empty version.
        run: |
          version=$(grep -oP 'val ndkVersion: String = "\K[^"]+' "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt")
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        if: matrix.target == 'Android'
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/${{ steps.ndk.outputs.version }}
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-ndk-${{ steps.ndk.outputs.version }}-cmake-3.22.1

      - name: Build for Android
        if: matrix.target == 'Android'
        # Only arm64, which every current phone runs: CI checks that the app builds, and each ABI is another full
        # AOT compile. Store builds are made locally for all ABIs. One retry for the mirror outages described above.
        run: |
          flutter build apk --target-platform android-arm64 || { sleep 60; flutter build apk --target-platform android-arm64; }

      - name: Build for iOS
        if: matrix.target == 'iOS'
        run: flutter build ios --no-codesign

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        if: matrix.target == 'Android'
        with:
          name: coldchat-android.apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Pack iOS ipa
        if: matrix.target == 'iOS'
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -rf build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/Runner.app
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Payload build/ios/iphoneos/iOS.ipa

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v7
        if: matrix.target == 'iOS'
        with:
          name: coldchat-ios.ipa
          path: build/ios/iphoneos/iOS.ipa
