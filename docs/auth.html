<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-yKCOuGae7k2sC9//jH8PQVSOqWLgkJdmg3b86tiasFo='; style-src 'unsafe-inline'">
  <title>Back to ColdChat</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 0 24px; }
    a { display: inline-block; margin-top: 16px; padding: 12px 24px; border-radius: 12px; background: #9146ff; color: #fff;
        font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <p>Returning to ColdChat&hellip;</p>
    <a id="back" href="coldchat://auth">Open ColdChat</a>
  </main>
  <!-- Twitch redirects here after a login (lib/modal/login_flow.dart). This page only hands Twitch's answer to the
       app: the access token is in the fragment, which the browser never sends to this server, and nothing is
       stored or loaded from anywhere else. The button is for browsers that block the automatic hand-over. -->
  <script>var target = 'coldchat://auth' + location.search + location.hash; document.getElementById('back').href = target; location.replace(target);</script>
</body>
</html>
